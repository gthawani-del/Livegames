<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Dragon Tiger wall elevations</title>
  <desc id="desc">Concept north and south wall elevations showing backed relief alcoves and a functional open arrival portal.</desc>
  <rect width="1200" height="900" fill="#fff"/>
  <g fill="none" stroke="#111">
    <rect x="100" y="105" width="1000" height="310" stroke-width="4"/>
    <rect x="235" y="175" width="190" height="190" rx="20" stroke-width="3"/>
    <circle cx="330" cy="270" r="68" stroke-width="2"/>
    <rect x="775" y="175" width="190" height="190" rx="20" stroke-width="3"/>
    <circle cx="870" cy="270" r="68" stroke-width="2"/>
    <rect x="490" y="145" width="220" height="75" stroke-width="2"/>
    <path d="M475 415V300 C475 255 520 230 600 230 C680 230 725 255 725 300V415" stroke-width="3"/>
    <rect x="100" y="520" width="1000" height="310" stroke-width="4"/>
    <path d="M450 830V595H750V830" stroke-width="4"/>
    <rect x="535" y="540" width="130" height="45" stroke-width="2"/>
    <path d="M450 595H750" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="50" y="45" font-size="26" font-weight="700">WALL ELEVATIONS — CONCEPT FUNCTION REVIEW</text>
    <text x="105" y="95" font-size="18">NORTH / DEALER BACKDROP</text>
    <text x="330" y="275" font-size="16" text-anchor="middle">DRAGON</text>
    <text x="870" y="275" font-size="16" text-anchor="middle">TIGER</text>
    <text x="600" y="190" font-size="16" text-anchor="middle">RESULT DISPLAY</text>
    <text x="600" y="360" font-size="16" text-anchor="middle">DEALER + TABLE HERO RESERVE</text>
    <text x="105" y="510" font-size="18">SOUTH / PRIMARY ARRIVAL</text>
    <text x="600" y="568" font-size="15" text-anchor="middle">SPARTAN CREST</text>
    <text x="600" y="700" font-size="18" text-anchor="middle">3.0 m OPEN PORTAL</text>
    <text x="600" y="724" font-size="15" text-anchor="middle">4.0 m VISIBLE PASSAGE DEPTH</text>
  </g>
</svg>
