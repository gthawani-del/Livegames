  </defs>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="50" y="45" font-size="26" font-weight="700">LOWER ROOM — CONCEPT FUNCTION PLAN</text>
    <text x="50" y="72" font-size="15">Scale 1:100 at 1000 px • room 10 m × 14 m • north at top</text>
    <text x="270" y="205" font-size="18" text-anchor="middle">DRAGON RELIEF</text>
