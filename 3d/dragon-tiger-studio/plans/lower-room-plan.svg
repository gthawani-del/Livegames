    <path d="M438 812 C425 752 430 670 465 630 C486 608 514 608 535 630 C570 670 575 752 562 812" stroke-width="2"/>
    <ellipse cx="500" cy="525" rx="120" ry="75" stroke-dasharray="12 8"/>
    <path d="M500 1070 C500 940 500 845 500 760" stroke="#555" stroke-width="8" marker-end="url(#arrow)"/>
    <path d="M500 925 L450 1000 L550 1000Z"/>
    <path d="M383 648 L410 635 L426 666 L397 678Z"/>
    <path d="M574 653 L608 648 L614 676 L580 681Z"/>
    <rect x="454" y="696" width="36" height="52" rx="5"/>
