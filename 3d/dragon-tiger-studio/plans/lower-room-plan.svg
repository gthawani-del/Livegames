    <text x="373" y="625" font-size="15" text-anchor="end">SHOE</text>
    <text x="373" y="644" font-size="14" text-anchor="end">CAMERA-LEFT</text>
    <text x="628" y="646" font-size="15">DISCARD</text>
    <text x="472" y="774" font-size="14" text-anchor="middle">DRAGON</text>
    <text x="528" y="774" font-size="14" text-anchor="middle">TIGER</text>
