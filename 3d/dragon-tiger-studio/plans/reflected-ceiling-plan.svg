<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Dragon Tiger reflected ceiling plan</title>
  <desc id="desc">Ceiling plan with a central recessed cove, six lighting zones and a clear hero reserve over the dealer and table.</desc>
  <rect width="1000" height="1200" fill="#fff"/>
  <g fill="none" stroke="#111">
    <rect x="120" y="90" width="760" height="1020" stroke-width="4"/>
    <rect x="205" y="180" width="590" height="710" rx="150" stroke-width="3"/>
    <ellipse cx="500" cy="555" rx="225" ry="245" stroke-width="2" stroke-dasharray="12 8"/>
    <rect x="365" y="400" width="270" height="310" rx="60" stroke-width="3"/>
    <g stroke-width="3">
      <circle cx="290" cy="330" r="24"/><circle cx="710" cy="330" r="24"/>
      <circle cx="250" cy="690" r="24"/><circle cx="750" cy="690" r="24"/>
      <circle cx="375" cy="850" r="24"/><circle cx="625" cy="850" r="24"/>
    </g>
    <path d="M500 220V880M250 555H750" stroke="#777" stroke-width="1" stroke-dasharray="6 6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="50" y="45" font-size="26" font-weight="700">REFLECTED CEILING — CONCEPT PLAN</text>
    <text x="50" y="72" font-size="15">Bilateral lighting rhythm • no pendant inside dealer/card sightline</text>
    <text x="500" y="542" font-size="18" text-anchor="middle">DEALER + TABLE</text>
    <text x="500" y="566" font-size="18" text-anchor="middle">HERO RESERVE</text>
    <text x="500" y="930" font-size="16" text-anchor="middle">RECESSED COVE CONTINUES TO ARRIVAL</text>
    <text x="290" y="335" font-size="13" text-anchor="middle">L1</text><text x="710" y="335" font-size="13" text-anchor="middle">L2</text>
    <text x="250" y="695" font-size="13" text-anchor="middle">L3</text><text x="750" y="695" font-size="13" text-anchor="middle">L4</text>
    <text x="375" y="855" font-size="13" text-anchor="middle">L5</text><text x="625" y="855" font-size="13" text-anchor="middle">L6</text>
  </g>
</svg>
